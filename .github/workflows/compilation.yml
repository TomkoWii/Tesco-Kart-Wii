name: TomkoWii Compiler

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
    - name: Get Source Code
      uses: actions/checkout@v4

    - name: Setup Wii Environment & Dependencies
      run: |
        dkp-pacman -Syy --noconfirm
        dkp-pacman -S wii-dev ppc-libpng ppc-freetype ppc-libjpeg-turbo libfat-ogc --noconfirm

    - name: Download and Install GRRLIB
      run: |
        git clone https://github.com/GRRLIB/GRRLIB
        make -C GRRLIB/GRRLIB clean all install

    - name: Compile TomkoWii Binary
      run: |
        make -f Makefile clean
        make -f Makefile

    - name: Save Wii Executable
      uses: actions/upload-artifact@v4
      with:
        name: TomkoWii-Release
        path: TomkoWii.dol
        
