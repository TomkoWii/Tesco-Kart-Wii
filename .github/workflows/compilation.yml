name: Build TomkoWii

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install GRRLIB Dependency
      run: |
        dkp-pacman -Syy --noconfirm
        dkp-pacman -S wii-grrlib --noconfirm

    - name: Compile Game
      run: |
        make clean
        make
        
