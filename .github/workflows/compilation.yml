name: Build TomkoWii

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install GRRLIB Dependency
      run: |
        dkp-pacman -Syy --noconfirm
        dkp-pacman -S wii-grrlib --noconfirm

    - name: Compile TomkoWii Game
      run: make

    - name: Upload compiled Wii Executable
      uses: actions/upload-artifact@v4
      with:
        name: TomkoWii-Executable
        path: TomkoWii.dol
        
